<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bcd9f2;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:#2b2140;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:filter .4s}
body.rewinding #cv{filter:sepia(.85) saturate(1.3) hue-rotate(-12deg) contrast(1.05)}
body.slowmo #cv{filter:saturate(.55) contrast(1.08)}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 26px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#ff8a3d,#f0602a);box-shadow:0 5px 0 #b8421b,0 8px 18px rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8421b}
.btn.blue{background:linear-gradient(#4aa8ff,#2d7fe0);box-shadow:0 5px 0 #1d58a3,0 8px 18px rgba(0,0,0,.25)}
.btn.green{background:linear-gradient(#5ccf6e,#2fa84a);box-shadow:0 5px 0 #1f7a34,0 8px 18px rgba(0,0,0,.25)}
.btn.gray{background:linear-gradient(#9aa3b5,#78839a);box-shadow:0 5px 0 #545d70}
.panel{background:rgba(255,253,246,.96);border-radius:22px;box-shadow:0 10px 30px rgba(40,30,80,.28);border:3px solid #fff}

/* title */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4vh 16px;z-index:30;pointer-events:none}
#title .logo{pointer-events:none;text-align:center;filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 8px 14px rgba(0,0,0,.25))}
#title h1{margin:0;font-size:clamp(34px,7vw,68px);font-weight:900;color:#203a8f;letter-spacing:2px;-webkit-text-stroke:2px #fff;paint-order:stroke fill}
#title h1 b{color:#e8304f}
#title .sub{display:inline-block;margin-top:8px;background:#ffe45c;border-radius:14px;padding:6px 18px;font-size:clamp(16px,2.6vw,24px);font-weight:900;color:#3a2a10}
#title .box{pointer-events:auto;padding:18px 22px;text-align:center;width:min(560px,96vw)}
#title .row{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap}
#title .lab{font-weight:900;font-size:17px;color:#5a4a7a;margin-right:4px}
.chip{border:3px solid #e2dcef;background:#fff;border-radius:16px;padding:8px 16px;font-size:18px;font-weight:700;color:#4a3d66}
.chip.on{border-color:#ff8a3d;background:#fff3e8;color:#d4551d}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d8d0e6}
.sw.on{box-shadow:0 0 0 4px #ff8a3d}
#title .note{font-size:13px;color:#7a7090;margin-top:10px;line-height:1.5}

/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .top{position:absolute;left:12px;top:12px;display:flex;gap:10px;align-items:center;pointer-events:auto}
#hud .badges{display:flex;gap:6px;padding:8px 12px;align-items:center}
#hud .badges .bd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#e9e4f0;filter:grayscale(1);opacity:.55}
#hud .badges .bd.on{background:radial-gradient(#fff6b0,#ffc93c);filter:none;opacity:1;box-shadow:0 0 0 3px #fff,0 0 12px #ffcf3c}
#hud .badges .lab{font-weight:900;font-size:15px;color:#5a4a7a;margin-right:4px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:#fffdf6;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:auto}
#topR{position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:26}
#dest{position:absolute;right:12px;top:72px;width:min(300px,44vw);padding:12px;pointer-events:auto}
#dest h3{margin:2px 4px 8px;font-size:18px;color:#3d2f66}
.dcard{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:3px solid transparent;background:#fff;border-radius:16px;padding:8px 10px;margin-bottom:8px;box-shadow:0 2px 6px rgba(60,40,100,.12)}
.dcard.on{border-color:#ff8a3d;background:#fff4e9}
.dcard .ic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:#eef3ff;border-radius:12px;flex:none}
.dcard .tx b{display:block;font-size:16px;color:#2b2140}
.dcard .tx span{font-size:13px;color:#7a6f92}
.dcard .st{margin-left:auto;font-size:13px;font-weight:900;color:#2fa84a;white-space:nowrap}
.dcard .st.todo{color:#e8304f}
#dest .more{font-size:12.5px;color:#8a80a0;text-align:center;margin-top:2px}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 18px;font-size:15px;font-weight:700;color:#4a3d66;white-space:nowrap}
#near{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);padding:14px 20px;text-align:center;pointer-events:auto;width:min(440px,92vw);animation:pop .3s}
#near .t{font-size:20px;font-weight:900;color:#d4551d}
#near .d{font-size:15px;margin:6px 0 12px;color:#4a3d66;line-height:1.5}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#joy{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(0,0,0,.25)}

/* story */
#story{position:fixed;inset:0;pointer-events:none;z-index:20}
#story .lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .5s}
#story .lb.t{top:0}#story .lb.b{bottom:0}
#story.on .lb{height:7vh}
#vig{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));opacity:0;transition:opacity .5s}
#vig.on{opacity:1}
#vig.warm{opacity:1;background:radial-gradient(ellipse at center,transparent 42%,rgba(255,140,165,.4))}
.bravo{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:39;pointer-events:none;font-size:clamp(34px,7vw,76px);font-weight:900;color:#fff;white-space:nowrap;-webkit-text-stroke:3px #f08a1c;paint-order:stroke fill;text-shadow:0 0 24px #ffd84d,0 6px 0 #c96a00;animation:bravo 2.1s ease-out forwards}
@keyframes bravo{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1.05);opacity:0}}
#vig.devil{background:radial-gradient(ellipse at center,transparent 50%,rgba(90,0,40,.55))}
#sub{position:absolute;left:50%;bottom:calc(7vh + 14px);transform:translateX(-50%);width:min(900px,95vw);display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
#sub .pt{width:96px;height:96px;flex:none;border-radius:50%;background:#fff center/cover no-repeat;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);display:grid;place-items:center;font-size:48px}
#sub .bx{flex:1;padding:12px 18px 10px;position:relative;min-height:96px}
#sub .nm{position:absolute;top:-16px;left:16px;background:#2d7fe0;color:#fff;font-weight:900;font-size:17px;padding:3px 14px;border-radius:12px}
#sub .tx{font-size:clamp(18px,2.2vw,24px);font-weight:700;line-height:1.55;color:#2b2140;min-height:2.6em;padding-top:6px}
#sub .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#sub .nx{border:0;border-radius:14px;padding:8px 18px;font-size:17px;font-weight:900;background:#c9c3d6;color:#fff;transition:background .3s}
#sub .nx.ready{background:#ff7a33;box-shadow:0 3px 0 #b8421b;animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
#sub.devil .nm{background:#6a2a5a}#sub.devil .bx{background:#f8eef6}
#sub.angel .nm{background:#e8a51c}
#sub.nar .nm{background:#5d6b84}
#sub.me .nm{background:#2fa84a}
#sub.teacher .nm{background:#7a5bd0}

#choice{position:fixed;left:50%;bottom:calc(7vh + 14px);transform:translateX(-50%);width:min(760px,95vw);padding:16px;z-index:22;pointer-events:auto}
#choice .q{font-size:clamp(19px,2.4vw,24px);font-weight:900;color:#3d2f66;margin:0 4px 12px;display:flex;align-items:center;gap:8px}
#choice .opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:clamp(17px,2.2vw,21px);font-weight:700;padding:12px 16px;border-radius:16px;border:3px solid #ddd5ee;background:#fff;color:#2b2140;transition:transform .12s}
.opt:hover{transform:scale(1.015)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef3ff;color:#2d7fe0;font-weight:900}
.opt.devil{border-color:#c5307a;background:linear-gradient(90deg,#ffe6f2,#fff);box-shadow:0 0 0 0 rgba(197,48,122,.6);animation:dglow 1.4s infinite}
.opt.devil .k{background:#c5307a;color:#fff}
@keyframes dglow{50%{box-shadow:0 0 18px 4px rgba(197,48,122,.45)}}
.opt.locked{color:transparent;text-shadow:0 0 9px rgba(60,50,90,.55);background:#f1eef6;border-style:dashed;position:relative}
.opt.locked .k{color:#999;background:#e3e0ea;text-shadow:none}
.opt.locked::after{content:'🔒 良心的聲音被小惡魔蓋住了……';position:absolute;right:14px;font-size:14px;color:#8a80a0;text-shadow:none}
.opt.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#choice .tag{font-size:13px;font-weight:900;padding:3px 10px;border-radius:10px;background:#ffe2ef;color:#c5307a}
#choice .tag.a{background:#fff3c9;color:#b67b00}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
#flash{position:fixed;inset:0;pointer-events:none;z-index:41;opacity:0}
#rw{position:fixed;inset:0;z-index:35;display:grid;place-items:center;pointer-events:none}
#rw .c{width:min(260px,50vw);height:min(260px,50vw);position:relative;opacity:.9;filter:drop-shadow(0 0 20px #fff6c0)}
#rw .c svg{width:100%;height:100%}
#rw .hand{transform-origin:100px 100px;animation:back 0.6s linear infinite}
#rw .hand2{transform-origin:100px 100px;animation:back 3.6s linear infinite}
@keyframes back{to{transform:rotate(-360deg)}}

/* ===== design system v2 ===== */
:root{--navy:#1d2466;--ink:#2a2f6b;--cream:#fffaf0}
.panel{background:linear-gradient(#fffdf8,#fff3dc);border:3px solid var(--ink);border-radius:22px;box-shadow:inset 0 2px 0 #fff,0 6px 0 rgba(29,36,102,.3),0 16px 30px rgba(15,18,60,.28)}
.btn{position:relative;overflow:hidden;border:3px solid #7a2a00;background:linear-gradient(#ffc04f,#ff8424 55%,#f25a10);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(150,45,0,.3),0 6px 0 #7a2a00,0 14px 22px rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(120,40,0,.55);letter-spacing:2px;padding:12px 30px}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.8s infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 2px 0 #7a2a00}
.btn:disabled{filter:grayscale(.6);opacity:.85}
.btn.blue{border-color:#12357a;background:linear-gradient(#6cc0ff,#2f8ae8 55%,#1f66c9);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(10,40,110,.3),0 6px 0 #12357a,0 14px 22px rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(10,40,110,.6)}
.btn.green{border-color:#16592a;background:linear-gradient(#8be07a,#3cb654 55%,#27963f);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(10,80,30,.3),0 6px 0 #16592a,0 14px 22px rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(10,80,30,.6)}
.btn.gray{border-color:#3d4458;background:linear-gradient(#b8c0d2,#8791a8 55%,#6c768e);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 6px 0 #3d4458;text-shadow:0 2px 0 rgba(40,45,60,.6)}
.iconbtn{border:3px solid var(--ink);background:linear-gradient(#fffdf8,#ffeecb);box-shadow:inset 0 2px 0 #fff,0 4px 0 rgba(29,36,102,.35);width:50px;height:50px}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,36,102,.35)}
/* title */
#title{justify-content:flex-start;padding:4.6vh 16px 0}
.tscrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(70,140,235,.55),rgba(120,190,255,0) 36%),linear-gradient(0deg,rgba(18,22,80,.78),rgba(18,22,80,0) 46%)}
.tspark i{position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:0 0 14px 5px rgba(255,240,170,.9);opacity:0;animation:tsp 4s infinite}
.tspark i:nth-child(1){left:12%;top:30%}.tspark i:nth-child(2){left:84%;top:22%;animation-delay:.8s}.tspark i:nth-child(3){left:70%;top:52%;animation-delay:1.6s}.tspark i:nth-child(4){left:24%;top:58%;animation-delay:2.2s}.tspark i:nth-child(5){left:48%;top:12%;animation-delay:3s}.tspark i:nth-child(6){left:92%;top:66%;animation-delay:1.2s}
@keyframes tsp{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
#title .logo{position:relative;filter:none;display:flex;flex-direction:column;align-items:center;animation:floaty 4s ease-in-out infinite;transform-origin:center}
@keyframes floaty{50%{transform:translateY(-8px) rotate(-.6deg)}}
#title .emb{width:clamp(64px,10vw,104px);height:auto;margin-bottom:-18px;z-index:2;filter:drop-shadow(0 5px 0 rgba(15,18,70,.45))}
.emb .eh1{transform-origin:60px 60px;animation:back 3s linear infinite}.emb .eh2{transform-origin:60px 60px;animation:back 14s linear infinite}
#title h1{font-size:clamp(44px,9.5vw,104px);line-height:1.05;letter-spacing:4px;transform:rotate(-2.5deg);-webkit-text-stroke:0;color:inherit;filter:drop-shadow(0 8px 0 #11164a) drop-shadow(0 16px 18px rgba(0,0,20,.4))}
#title h1 span{-webkit-text-stroke:clamp(8px,1.4vw,14px) #1d2466;paint-order:stroke fill}
#title h1 .l1{color:#fff}#title h1 .l2{color:#ffd23f;margin-left:.08em;text-shadow:0 -3px 0 #fff3b0 inset}
#title .sub{position:relative;margin-top:6px;background:none;padding:0;transform:rotate(-2.5deg)}
#title .sub span{position:relative;display:inline-block;background:linear-gradient(#ff5d6c,#e8304f);color:#fff;border:3px solid #7a1026;border-radius:10px;padding:6px 26px;font-size:clamp(17px,2.7vw,28px);font-weight:900;letter-spacing:2px;box-shadow:0 5px 0 #7a1026,0 10px 16px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(120,10,30,.6)}
#title .box{position:absolute;left:50%;bottom:max(46px,5vh);transform:translateX(-50%);width:min(720px,94vw);padding:16px 20px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
#title .row{margin:0;gap:10px}
#title .lab{font-size:16px;color:var(--ink);letter-spacing:1px}
.chip.pc{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;padding:8px 6px 6px;border:3px solid #c9c3e0;border-radius:18px;background:linear-gradient(#fff,#f1eeff);position:relative;transition:transform .12s;box-shadow:0 4px 0 #c9c3e0}
.chip.pc .ph{width:68px;height:68px;border-radius:50%;background:#dfeaff center/cover no-repeat;display:grid;place-items:center;font-size:36px;border:3px solid #fff;box-shadow:0 0 0 2px #c9c3e0}
.chip.pc b{font-size:17px;color:var(--ink)}
.chip.pc.on{border-color:#ff8a1f;background:linear-gradient(#fff8e6,#ffe9bd);box-shadow:0 4px 0 #c96a00,0 0 0 4px rgba(255,200,60,.55),0 0 22px rgba(255,190,60,.8);transform:translateY(-4px)}
.chip.pc.on .ph{box-shadow:0 0 0 3px #ff8a1f}
.chip.pc.on::after{content:'✓';position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;background:#3cb654;color:#fff;font-weight:900;display:grid;place-items:center;border:3px solid #fff;font-size:15px}
.startw{display:flex;flex-direction:column;align-items:center;gap:8px}
.btn.big{font-size:clamp(22px,3vw,30px);padding:14px 44px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.045)}}
#title .note{margin:0;font-size:13px;color:#6a6390;text-align:center}
#title .foot{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:rgba(255,255,255,.85);font-size:13px;letter-spacing:2px;text-shadow:0 1px 3px rgba(0,0,30,.7)}
/* hud */
#hud .badges{padding:6px 14px 6px 12px;border-radius:999px;gap:8px}
#hud .badges .lab{background:var(--navy);color:#ffd23f;padding:4px 12px;border-radius:999px;font-size:14px;letter-spacing:1px}
#hud .badges .bd{border:2px solid #c9c3e0;background:#eeeaf8}
#hud .badges .bd.on{border-color:#c98a00}
#dest{padding:0 12px 10px;overflow:hidden}
#dest h3{margin:0 -12px 10px;padding:9px 14px;background:linear-gradient(#2c35a0,#1d2466);color:#fff;font-size:17px;letter-spacing:2px;border-bottom:3px solid #ffd23f}
.dcard{border:3px solid #e6e0f5;box-shadow:0 3px 0 #e6e0f5;border-radius:14px;transition:transform .1s}
.dcard:hover{transform:translateX(-3px)}
.dcard.on{border-color:#ff8a1f;box-shadow:0 3px 0 #c96a00;background:linear-gradient(#fff8e6,#ffedc9)}
.dcard .ic{background:linear-gradient(#e3edff,#cfdcff);border:2px solid #b9c8f5}
.dcard .st{background:#e6f7ea;padding:3px 9px;border-radius:999px}.dcard .st.todo{background:#ffe6ea}
#hint{display:flex;align-items:center;gap:6px;border-radius:999px;padding:7px 18px}
#hint em{width:14px}
kbd{font-family:inherit;font-size:13px;font-weight:900;background:#fff;border:2px solid var(--ink);border-bottom-width:4px;border-radius:7px;padding:1px 7px;color:var(--ink)}
#near .t{font-size:22px;color:var(--navy)}
#near{border-color:#ff8a1f;box-shadow:inset 0 2px 0 #fff,0 6px 0 #c96a00,0 0 0 5px rgba(255,200,60,.4),0 16px 30px rgba(15,18,60,.3)}
#joy{background:rgba(29,36,102,.25);border:3px solid rgba(255,255,255,.9)}
#joy i{background:linear-gradient(#fff,#ffe9bd);border:3px solid var(--ink)}
/* dialogue */
#sub .pt{border:4px solid var(--ink);box-shadow:0 0 0 4px #fff,0 6px 0 rgba(29,36,102,.3),0 10px 18px rgba(0,0,0,.3);background-color:#dfeaff}
#sub .bx{border-radius:20px}
#sub .nm{top:-19px;border:3px solid var(--ink);border-radius:999px;padding:3px 18px;box-shadow:0 3px 0 rgba(29,36,102,.3);letter-spacing:1px}
#sub .nx{border:3px solid #8a86a3;border-radius:999px;background:#c9c5da;padding:6px 20px}
#sub .nx.ready{border-color:#7a2a00;background:linear-gradient(#ffc04f,#ff7a1f);box-shadow:0 3px 0 #7a2a00}
#sub.devil .bx{background:linear-gradient(#fbeef8,#f1d9ec);border-color:#5a1f4c}#sub.devil .nm{border-color:#3a1030}#sub.devil .pt{border-color:#5a1f4c}
#sub.angel .bx{background:linear-gradient(#fffdf0,#fff3c4)}#sub.angel .pt{border-color:#c98a00}
#sub .pt.svg{overflow:hidden;padding:0;background:none}#sub .pt.svg svg{width:100%;height:100%;display:block}
#sub .pt.svg{animation:ptpop .35s ease-out}@keyframes ptpop{0%{transform:scale(.8)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
#choice{border-radius:24px}
#choice .q{color:var(--navy)}
.opt{border:3px solid #cfc8ea;box-shadow:0 4px 0 #cfc8ea;border-radius:16px;transition:transform .1s,box-shadow .1s}
.opt:hover{transform:translateY(-3px);border-color:#ff8a1f;box-shadow:0 7px 0 #c96a00;background:#fff8e6}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #c96a00}
.opt .k{background:var(--navy);color:#ffd23f;border:2px solid #fff;box-shadow:0 0 0 2px var(--navy)}
#choice .tag.a{background:#ffd23f;color:#5a3a00;border:2px solid #c98a00}
/* overlays */
.ovl{background:radial-gradient(ellipse at center,rgba(40,48,140,.45),rgba(10,12,50,.75));backdrop-filter:blur(3px)}
.ovl .panel{padding:0 24px 22px;overflow:auto}
.ovl h2{margin:0 -24px 14px;padding:14px 20px;background:linear-gradient(#2c35a0,#1d2466);color:#fff;border-bottom:4px solid #ffd23f;letter-spacing:2px;text-shadow:0 3px 0 rgba(0,0,40,.5);position:sticky;top:0;z-index:2}
.case{border:3px solid var(--ink);box-shadow:0 4px 0 rgba(29,36,102,.2);background:repeating-linear-gradient(#fff,#fff 30px,#f3f1fb 31px)}
.case .no{border:3px solid #7a1026;box-shadow:0 2px 0 #7a1026}
.pill{border:3px solid #7a1026;transform:rotate(-2deg);letter-spacing:1px}.pill.blue{border-color:#12357a}
.tip{border:2px dashed #e0b44a}.why{border:2px dashed #e88a98}
.badgeBig{position:relative;border:5px solid #c98a00}
.badgeBig::before{content:'';position:absolute;inset:-46px;z-index:-1;background:repeating-conic-gradient(rgba(255,210,63,.55) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:back 16s linear infinite reverse;-webkit-mask:radial-gradient(circle,#000 35%,transparent 70%);mask:radial-gradient(circle,#000 35%,transparent 70%)}
.over .panel{background:linear-gradient(#f4f4f6,#dcdde3);border-color:#1b1c22}
.over h2{background:linear-gradient(#3a3b44,#17181d);border-bottom-color:#c0213f;color:#fff}
.stamp{position:absolute;right:18px;top:60px;z-index:3;transform:rotate(12deg);border:5px solid #c0213f;color:#c0213f;font-weight:900;font-size:22px;letter-spacing:3px;padding:2px 12px;border-radius:8px;opacity:.85;background:rgba(255,255,255,.6)}
.over .panel{position:relative}
#toast{border-radius:999px;background:var(--navy);color:#fff;border-color:#ffd23f;box-shadow:0 5px 0 rgba(0,0,30,.35)}
/* jail */
body.jail #cv{filter:grayscale(1) contrast(1.2) brightness(.72)}
#bars{position:fixed;inset:0;z-index:19;pointer-events:none;animation:barsdrop .8s cubic-bezier(.3,0,.6,1) both;background:repeating-linear-gradient(90deg,transparent 0 6.6vw,#0b0b0e 6.6vw 6.9vw,#4a4b55 6.9vw 7.5vw,#1a1a20 7.5vw 8.3vw,#050506 8.3vw 8.6vw);filter:drop-shadow(8px 0 10px rgba(0,0,0,.6))}

@keyframes barsdrop{0%{transform:translateY(-110%)}60%{transform:translateY(0)}74%{transform:translateY(-3.5%)}86%{transform:translateY(0)}93%{transform:translateY(-1%)}100%{transform:translateY(0)}}

/* loading bar */
#lbar{position:relative;width:min(300px,70vw);height:46px;border:3px solid var(--ink);border-radius:999px;background:#e9e4f6;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.08),0 5px 0 rgba(29,36,102,.3)}
#lbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(-45deg,#ffb02e 0 14px,#ffc95a 14px 28px);border-radius:999px;transition:width .25s;animation:lbmove 1s linear infinite;background-size:40px 100%}
@keyframes lbmove{to{background-position:40px 0}}
#lbar b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;color:var(--navy);letter-spacing:1px;text-shadow:0 1px 0 #fff}
/* comic panels */
#cm{position:fixed;inset:0;z-index:18;pointer-events:none;overflow:hidden}

.cmtone{background:radial-gradient(circle,rgba(20,22,58,.5) 1.2px,transparent 1.6px) 0 0/7px 7px;-webkit-mask:linear-gradient(200deg,#000,transparent 38%);mask:linear-gradient(200deg,#000,transparent 38%);opacity:.55}
.cmp.whisper .cmfx,.cmp.dark .cmfx{background:radial-gradient(ellipse at center,transparent 40%,rgba(70,0,80,.8))}

@keyframes cmwave{from{transform:scale(.8)}to{transform:scale(1)}}
.cmp.speed .cmfx,.cmp.shock .cmfx,.cmp.impact .cmfx{inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 46%,transparent 0 3.2deg,rgba(255,255,255,.92) 3.2deg 4deg,transparent 4deg 8.5deg,rgba(255,255,255,.75) 8.5deg 9deg,transparent 9deg 13deg);-webkit-mask:radial-gradient(ellipse at 50% 46%,transparent 30%,#000 62%);mask:radial-gradient(ellipse at 50% 46%,transparent 30%,#000 62%);animation:cmflick .14s steps(2) infinite}

@keyframes cmflick{to{transform:rotate(3deg) scale(1.04)}}
.cmp.impact,.cmp.shock{animation:cmshake .09s steps(2) 8}
@keyframes cmshake{to{margin:5px 0 0 -6px}}
.cmp.glow .cmfx{inset:-40%;background:repeating-conic-gradient(rgba(255,236,150,.6) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,transparent 26%,#000 70%);mask:radial-gradient(circle,transparent 26%,#000 70%);animation:back 9s linear infinite reverse}
.cmp.glow{outline-color:#c98a00;border-color:#fff7c9}
.cmtag{position:absolute;left:0;top:0;background:#ffd23f;color:#14163a;font-weight:900;padding:3px 12px 4px;border-right:4px solid #14163a;border-bottom:4px solid #14163a;font-size:clamp(13px,1.7vw,20px);letter-spacing:1px}
.cmp.whisper .cmtag{background:#c5307a;color:#fff}.cmp.impact .cmtag{background:#e8203a;color:#fff}
.cmem{position:absolute;right:5%;top:5%;font-size:clamp(32px,5.4vw,70px);font-weight:900;color:#ffec3d;-webkit-text-stroke:5px #14163a;paint-order:stroke fill;animation:empop .35s cubic-bezier(.2,2.2,.4,1) both,emwob .5s .35s ease-in-out infinite alternate;transform-origin:center}
@keyframes empop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(8deg)}}@keyframes emwob{from{transform:rotate(8deg)}to{transform:rotate(-4deg) scale(1.08)}}
.cmsfx{position:absolute;left:5%;bottom:5%;font-size:clamp(20px,3.2vw,40px);font-weight:900;color:#fff;-webkit-text-stroke:5px #14163a;paint-order:stroke fill;transform:rotate(-9deg);letter-spacing:2px;animation:emwob .4s ease-in-out infinite alternate}
.cmp.whisper .cmsfx{color:#f3c6ff}
.cmburst{position:absolute;left:50%;top:38%;width:min(40vw,56vh,400px);aspect-ratio:1.25;transform:translate(-50%,-50%) rotate(-6deg);animation:cmburst .4s cubic-bezier(.2,2,.4,1) both}
.cmburst.sm{width:min(26vw,36vh,250px);top:24%}

.cmburst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cmburst polygon{fill:#ffe23d;stroke:#14163a;stroke-width:5;stroke-linejoin:round}.cmburst polygon.sh{fill:#14163a;stroke:#14163a}
.cmburst.red polygon:not(.sh){fill:#fff}.cmburst.gold polygon:not(.sh){fill:#fff6b8}
.cmburst span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:.1em;font-weight:900;font-size:clamp(34px,min(8vw,11vh),96px);color:#e8203a;-webkit-text-stroke:6px #14163a;paint-order:stroke fill;letter-spacing:2px}
.cmburst.sm span{font-size:clamp(24px,min(5vw,7vh),58px);color:#ff7a1f}.cmburst.gold span{color:#ff9d00}
.cmburst span i{font-style:normal;-webkit-text-stroke:0;font-size:.8em}
@media (max-width:700px){.cmburst{top:46%}.cmburst.sm{top:42%}}
/* big result screens */
@keyframes slam{0%{opacity:0;transform:scale(3.4) rotate(var(--r,0deg))}70%{opacity:1;transform:scale(.94) rotate(var(--r,0deg))}100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
@keyframes starpop{0%{opacity:0;transform:scale(0) rotate(-180deg)}70%{transform:scale(1.5) rotate(10deg)}100%{opacity:1;transform:scale(1)}}
@keyframes rsShake{0%,100%{transform:none}20%{transform:translate(-12px,6px)}40%{transform:translate(10px,-8px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(5px,5px)}}
.ovl.full{padding:0;overflow-x:hidden;overflow-y:auto;backdrop-filter:none;display:flex;flex-direction:column;align-items:center}
.ovl.lose{padding:28px 0}
.ovl.full>.panel{position:relative;margin:auto 0;flex:0 0 auto;width:min(1140px,97vw);max-height:none;background:none;border:0;box-shadow:none;padding:2vh 0 3vh;overflow:visible;animation:none}
.ovl.win{background:radial-gradient(ellipse at 50% 38%,#fff6c4 0,#ffbf3c 26%,#3a44b8 68%,#11164a)}
.ovl.win::before{content:'';position:fixed;left:50%;top:38%;width:150vmax;height:150vmax;margin:-75vmax;background:repeating-conic-gradient(rgba(255,255,255,.2) 0 7deg,transparent 7deg 14deg);animation:back 50s linear infinite reverse;pointer-events:none}
.ovl.lose{background:radial-gradient(ellipse at 50% 34%,rgba(170,20,44,.86),rgba(22,4,10,.97) 72%)}
.ovl.lose::before,.ovl.lose::after{content:'';position:fixed;left:0;right:0;height:26px;background:repeating-linear-gradient(-45deg,#ffd23f 0 22px,#17181d 22px 44px);pointer-events:none;opacity:.9}
.ovl.lose::before{top:0}.ovl.lose::after{bottom:0}
.ovl.lose>.panel{animation:rsShake .5s .45s}
.rs-title{position:relative;font-size:clamp(46px,min(10.5vw,17vh),136px);font-weight:900;line-height:1.08;letter-spacing:6px;color:#ffd23f;-webkit-text-stroke:clamp(8px,1.5vw,18px) #1d2466;paint-order:stroke fill;filter:drop-shadow(0 8px 0 #11164a) drop-shadow(0 18px 20px rgba(0,0,30,.45));animation:slam .6s cubic-bezier(.3,1.3,.5,1) both}
.lose .rs-title{color:#ff3b4f;-webkit-text-stroke-color:#19040a;filter:drop-shadow(0 8px 0 #000) drop-shadow(0 0 40px rgba(255,40,60,.7));letter-spacing:10px}
.rs-sub{position:relative;font-size:clamp(22px,3.6vw,42px);font-weight:900;color:#fff;letter-spacing:6px;text-shadow:0 4px 0 #000;animation:pop2 .4s .5s both}
.rs-main{position:relative;display:flex;gap:min(4vw,48px);align-items:center;justify-content:center;flex-wrap:wrap;margin-top:2.5vh}
.rs-badge{flex:0 0 auto;text-align:center}
.ovl.full .badgeBig{width:clamp(170px,min(27vw,38vh),300px);height:clamp(170px,min(27vw,38vh),300px);font-size:clamp(96px,min(15vw,21vh),172px);margin:0 auto;border-width:8px;box-shadow:0 0 0 8px #fff,0 0 70px #ffe27a,0 14px 0 8px rgba(17,22,74,.35)}
.ovl.full .badgeBig::before{inset:-34%}
.ovl.full .stars{font-size:clamp(46px,min(7.5vw,10vh),88px);margin-top:10px;color:#ffe23d;text-shadow:0 5px 0 #c96a00,0 0 24px #fff3a0;letter-spacing:10px}
.stars i{display:inline-block;font-style:normal;animation:starpop .55s both}.stars i:nth-child(1){animation-delay:.55s}.stars i:nth-child(2){animation-delay:.8s}.stars i:nth-child(3){animation-delay:1.05s}
.rs-get{font-size:clamp(20px,2.8vw,32px);font-weight:900;color:#fff;text-shadow:0 3px 0 #11164a;margin-top:6px}
.rs-get b{display:block;font-size:1.35em;color:#ffe23d;letter-spacing:2px}
.lose .rs-get b{color:#fff}
.ovl.full .rs-info{flex:1 1 380px;max-width:540px;width:auto;max-height:none;padding:18px 20px 20px;text-align:left;overflow:visible;animation:pop2 .45s .6s both}
.ovl.full .rs-info .tip,.ovl.full .rs-info .why{font-size:clamp(17px,2vw,21px)}
.ovl.full .rs-info .ds{font-size:clamp(16px,1.8vw,19px);line-height:1.6;margin:10px 2px}
.ovl.full .btns{margin-top:14px;flex-wrap:nowrap}.ovl.full .btns .btn{white-space:nowrap}.lose .rs-main{margin-top:1.5vh}.lose .rs-title{font-size:clamp(44px,min(9vw,14vh),116px)}
.fine{--r:-7deg;display:inline-block;transform:rotate(-7deg);border:9px solid #ff3b4f;color:#e8203a;background:rgba(255,255,255,.95);border-radius:18px;padding:4px 30px 8px;font-size:clamp(34px,min(4.8vw,10vh),72px);font-weight:900;line-height:1.1;white-space:nowrap;animation:slam .5s .75s both;box-shadow:0 0 0 6px rgba(255,255,255,.25),0 18px 36px rgba(0,0,0,.6)}
.fine small{display:block;font-size:.26em;letter-spacing:8px;color:#7a1026;margin-bottom:-2px}
.ovl.verdict .panel{width:min(780px,96vw)}
.verdict .case .hd{font-size:clamp(24px,3.4vw,34px)}.verdict .case .ds{font-size:clamp(19px,2.4vw,24px)}
.verdict .pill{--r:-3deg;font-size:clamp(32px,5.6vw,56px);padding:8px 34px;border-width:5px;margin:8px 0 6px;animation:slam .5s .45s both}
@media (min-width:900px){.rs-main{flex-wrap:nowrap}.ovl.full .rs-info{flex:1 1 460px;min-width:min(400px,44vw);max-width:640px}.rs-badge{flex:0 1 auto;min-width:0}.fine{font-size:clamp(28px,min(3.6vw,9vh),72px)}}
.ovl.full .btns{flex-wrap:wrap}.ovl.full .btns .btn{flex:1 1 0;min-width:max-content}
.ovl.full .rs-info .tip,.ovl.full .rs-info .why{font-size:clamp(15px,min(2vw,2.3vh),21px)}.ovl.full .rs-info .ds{font-size:clamp(14px,min(1.8vw,2.1vh),19px);line-height:1.5}
@media (max-height:960px) and (min-width:700px){.lose .rs-title{font-size:clamp(40px,11vh,104px)}.ovl.full>.panel{padding:1vh 0 1.5vh}.lose .rs-main{margin-top:0.5vh}}
@media (max-height:820px) and (min-width:700px){.ovl.full .rs-info{padding:12px 16px 14px}.ovl.full .rs-info .ds{margin:6px 2px}.ovl.full .btns{margin-top:10px}}
@media (prefers-reduced-motion:reduce){.rs-title,.fine,.verdict .pill,.stars i,.ovl.lose>.panel,.cmp.impact,.cmp.shock{animation:none}}

#slow{position:fixed;left:50%;top:calc(7vh + 10px);transform:translateX(-50%);z-index:19;pointer-events:none;background:rgba(20,22,58,.88);color:#fff;font-weight:900;letter-spacing:6px;font-size:clamp(14px,1.8vw,20px);padding:5px 16px 5px 14px;border:3px solid #ffd23f;border-radius:999px;display:flex;align-items:center;gap:8px}
#slow i{width:12px;height:12px;border-radius:50%;background:#ff3b4f;animation:tsp .8s infinite}
.cmp.slotF,.cmp.slotC{box-shadow:6px 8px 0 rgba(10,12,40,.6)}
.cmburst{left:57%}.cmburst.sm{left:57%;top:20%}
@media (max-width:700px){.cmburst,.cmburst.sm{left:50%;top:60%}}

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(text,role){return new Promise(res=>{
  if(!VOICE||GAME.auto||!window.speechSynthesis){res();return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[「」『』]/g,'').replace(/……/g,'，'));
    u.lang='zh-TW';if(zhVoice)u.voice=zhVoice;u.pitch=role.p??1;u.rate=role.r??1;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);
    setTimeout(res,text.length*420+3000);}catch(e){res();}});}
function hush(){try{speechSynthesis.cancel();}catch(e){}if(typeof voiceStop==='function')voiceStop();}

function setVoice(v){VOICE=v;SND=v;if(!v)hush();}
function isVoice(){return VOICE;}

  if(!save.seenHelp){save.seenHelp=true;persist();busy=true;await overlay(HELP);busy=false;}
  if(!MAP.target){const p=PLACES.find(p=>!save.done[p.id]);if(p){MAP.target=p.id;renderDest();}}};
$('#helpBtn').onclick=async()=>{if(busy&&mode!=='title')return;SFX.click();const b=busy;busy=true;await overlay(HELP);busy=b;};
$('#voiceBtn').onclick=()=>{const v=!isVoice();setVoice(v);$('#voiceBtn').textContent=v?'🔊':'🔇';toast(v?'語音與音效：開':'語音與音效：關');};
$('#musicBtn').onclick=()=>{MUS.on=!MUS.on;if(MUS.bus&&AC)MUS.bus.gain.setTargetAtTime(MUS.on?MUS.vol:0,AC.currentTime,0.2);$('#musicBtn').style.opacity=MUS.on?1:0.45;toast(MUS.on?'音樂：開':'音樂：關');};
async function bootVRM(){const go=$('#go'),lb=$('#lbar'),bar=lb.querySelector('i'),lab=lb.querySelector('b');go.classList.add('hide');lb.classList.remove('hide');
  const ids=Object.keys(VRM_FILES),prog={};let parsed=0;
  const upd=msg=>{const f=ids.reduce((a,id)=>a+(prog[id]||0),0)/ids.length*0.55+parsed/ids.length*0.4+(GAME.voiceOK?0.05:0);bar.style.width=Math.round(f*100)+'%';lab.textContent=`${msg}… ${Math.round(f*100)}%`;};
  try{const vp=loadVoice().then(()=>upd('載入角色中'));try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]);}catch(e){}
    await Promise.all(ids.map(id=>loadBuf(id,f=>{prog[id]=f;upd('下載角色中');}).then(()=>{prog[id]=1;upd('下載角色中');}).catch(()=>{prog[id]=1;})));
    for(const id of ids){try{await getVRMChar(id);}catch(e){console.warn('VRM',id,e);}parsed++;upd('準備角色中');await new Promise(r=>setTimeout(r,0));}
    GAME.vrmOK=!!(VCH.me_b&&VCH.me_g);if(GAME.vrmOK){setLook();document.querySelectorAll('#title .row')[1].classList.add('hide');
      ['b','g'].forEach(g=>{const t=thumbFor('me_'+g);if(t){const e=$('#ph_'+g);e.style.backgroundImage=`url(${t})`;e.textContent='';}});}
    /* warm up: compile every character's shaders now so nothing hitches mid-story */
    try{const tmp=[];ids.forEach(id=>{const c=VCH[id];if(c&&!c.root.parent){campus.add(c.root);c.root.position.set(0,0,20);tmp.push(c);}});renderer.compile(campus,camera);tmp.forEach(c=>campus.remove(c.root));}catch(e){}
    ['xiaoyu','xiaokai','xiaomei','teacher'].forEach(k=>thumbFor(k));
    await Promise.race([vp,new Promise(r=>setTimeout(r,8000))]);
  }catch(e){console.warn('載入失敗，改用內建角色',e);GAME.vrmOK=!!(VCH.me_b&&VCH.me_g);}
  bar.style.width='100%';lab.textContent='準備完成！';await new Promise(r=>setTimeout(r,250));
  lb.classList.add('hide');go.classList.remove('hide');go.disabled=false;GAME.vrm=!!VRM_ME;try{['b','g'].forEach(g=>{const t=thumbFor('me_'+g);const e=$('#ph_'+g);if(t&&e){e.textContent='';e.style.backgroundImage='url('+t+')';e.style.backgroundSize='cover';}});}catch(e){console.warn('chip thumb',e);}GAME.ready=true;}
GAME.dbg=()=>({reward,gameOver,overlay,CASES,caseCard,srcOf,HELP,cmAmb,MAP,rig,camCut,V3,S,applyCam,curScene});GAME.runCase=id=>{busy=true;$('#title').classList.add('hide');musicPlay('campus');return runCase(id);};
GAME.start=()=>$('#go').click();
window.__vp=voicePlay;window.__dbg={makeDevil,makeAngel,thumbFor,renderer,THREE,SRGB,V3,thumbs,PORTRAIT,say,FX,storyOn,VO,vNow};GAME._dbg={cmShow,cmHide,reward:(id)=>reward(CASES[id]),gameOver:(id)=>gameOver(CASES[id],CASES[id].key.opts[1]),verdict:(id)=>overlay(`<h2>⚖️ 真實判決</h2><p>這個情境，改編自真實的法院判決：</p>${caseCard(CASES[id])}<div class="btns"><button class="btn blue big" data-a="ok">我知道了</button></div>`,'verdict'),fxRays,fxConfetti,fxHearts,fxSparks,bravo,walkTo,FX,rig,ROLE,VO,caseCard,CASES,srcOf,MAP,PLACES,pl:()=>player,setMode:m=>mode=m,camera,setLook,save,VCH,getVRMChar,npc,campus,LIVE};
bootVRM();

</script>
